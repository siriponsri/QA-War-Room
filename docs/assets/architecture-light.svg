<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="QA War Room architecture: browser pages talk only to a localhost server; records are released only on request; gold and the evaluator sit behind a boundary reached only after completion; live rooms make no model calls; API keys stay in a local git-ignored file.">
