<text x="490.0" y="272.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#8a5a00" text-anchor="middle">Time limit · Stop · Round limit</text>
<text x="490.0" y="290.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">saved as unfinished: no forced verdict, no reference answer</text>
</svg>
