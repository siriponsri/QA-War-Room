<text x="247" y="175" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4d6357" text-anchor="middle">not enough yet → request the next record</text>
<path d="M733 70 L733 40 L247 40 L247 70" fill="none" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#a-warn)"/>
<text x="490" y="32" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8a5a00" text-anchor="middle">challenge → a specific record is requested</text>
