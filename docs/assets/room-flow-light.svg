<path d="M85 158 L85 210" stroke="#d7a43a" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
<path d="M247 128 L247 210" stroke="#d7a43a" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
<path d="M409 158 L409 210" stroke="#d7a43a" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
<path d="M571 128 L571 210" stroke="#d7a43a" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
<path d="M733 128 L733 210" stroke="#d7a43a" stroke-width="1.2" stroke-dasharray="3 4" fill="none"/>
<path d="M490 210 L490 244" fill="none" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#a-warn)"/>
<text x="498" y="232" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8a5a00" text-anchor="start">any time</text>
