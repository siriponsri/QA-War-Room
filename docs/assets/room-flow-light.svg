<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Live room flow: the investigator requests a record, an owner delivers it, the checker reviews; more evidence loops back; a proposal gets a final review that can challenge for a specific record; completion unlocks the authored debrief; time limit, stop or round limit at any point saves unfinished work with no verdict and no reference answer.">
<title>Live room flow: the investigator requests a record, an owner delivers it, the checker reviews; more evidence loops back; a proposal gets a final review that can challenge for a specific record; completion unlocks the authored debrief; time limit, stop or round limit at any point saves unfinished work with no verdict and no reference answer.</title>
<defs><marker id="a-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6f63"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0a7a43"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a5a00"/></marker></defs>
<rect x="20" y="70" width="130" height="58" rx="10" fill="#f1f6f2" stroke="#c3d3c9" stroke-width="1.4"/>
<text x="85.0" y="96.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#13241b" text-anchor="middle">Phum requests</text>
<text x="85.0" y="114.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">one record</text>
<rect x="182" y="70" width="130" height="58" rx="10" fill="#f1f6f2" stroke="#c3d3c9" stroke-width="1.4"/>
<text x="247.0" y="96.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#13241b" text-anchor="middle">Chai / Fon deliver</text>
<text x="247.0" y="114.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">the requested record</text>
<rect x="344" y="70" width="130" height="58" rx="10" fill="#f1f6f2" stroke="#c3d3c9" stroke-width="1.4"/>
<text x="409.0" y="96.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#13241b" text-anchor="middle">Mind checks</text>
<text x="409.0" y="114.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">received facts only</text>
<rect x="506" y="70" width="130" height="58" rx="10" fill="#f1f6f2" stroke="#c3d3c9" stroke-width="1.4"/>
<text x="571.0" y="96.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#13241b" text-anchor="middle">Phum proposes</text>
<text x="571.0" y="114.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">a conclusion</text>
<rect x="668" y="70" width="130" height="58" rx="10" fill="#f1f6f2" stroke="#c3d3c9" stroke-width="1.4"/>
<text x="733.0" y="96.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#13241b" text-anchor="middle">Mind final review</text>
<text x="733.0" y="114.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">accept or challenge</text>
<rect x="830" y="70" width="130" height="58" rx="10" fill="#dcf1e4" stroke="#0a7a43" stroke-width="1.4"/>
<text x="895.0" y="96.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="650" fill="#0a7a43" text-anchor="middle">Completed</text>
<text x="895.0" y="114.0" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4d6357" text-anchor="middle">debrief unlocked</text>
<path d="M150 99 L182 99" fill="none" stroke="#5b6f63" stroke-width="1.6" marker-end="url(#a-line)"/>
